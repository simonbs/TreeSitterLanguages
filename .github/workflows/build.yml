name: Build
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    name: Build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global url."https://".insteadOf git://
      - name: Build
        run: |
          xcodebuild\
            -scheme TreeSitterLanguages-Package\
            -sdk iphonesimulator\
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro'
  compatibility:
    name: Tree-sitter 0.27.1 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Tree-sitter
        uses: actions/checkout@v4
        with:
          repository: tree-sitter/tree-sitter
          ref: v0.27.1
          path: .tree-sitter
      - name: Parse samples and execute bundled queries
        run: python3 Tests/Compatibility/test.py .tree-sitter
