name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global url."https://".insteadOf git://
      - name: Build and test Runestone language integrations
        run: |
          xcodebuild test\
            -scheme TreeSitterLanguages-Package\
            -sdk iphonesimulator\
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5'\
            -only-testing:RunestoneLanguageSupportTests\
            -only-testing:RequestedLanguageHighlightTests
  compatibility:
    name: Tree-sitter 0.27.1 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Tree-sitter
        uses: actions/checkout@v4
        with:
          repository: tree-sitter/tree-sitter
          ref: v0.27.1
          path: .tree-sitter
      - name: Parse samples and execute bundled queries
        run: python3 Tests/Compatibility/test.py .tree-sitter

  mapped:
    name: Mapped grammar resources
    runs-on: macos-15
    steps:
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify generated tables and loaders
        run: python3 scripts/generate-mapped-grammars.py --check
      - name: Compare native and mapped table contents
        run: python3 scripts/check-mapped-grammars.py
      - name: Test package resource lookup and concurrent initialization
        run: swift test --package-path Tests/Mapped --jobs 4
